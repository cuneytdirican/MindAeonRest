<!DOCTYPE html>
<html lang="tr" data-theme="okyanus">
<head>
  <meta charset="UTF-8" />
  <base href="/app/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#10b981" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MindAeon POS</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app"></div>
  <div id="toast-host"></div>
  <div id="modal-host"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js" crossorigin="anonymous" onerror="window.__noSignalR=true"></script>
  <script src="js/outbox.js"></script>
  <script src="js/snapshot.js"></script>
  <script src="js/api.js"></script>
  <script src="js/escpos.js"></script>
  <script src="js/printer.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(err =>
          console.warn('SW kayit hatasi', err));
      });
    }
  </script>
</body>
</html>
